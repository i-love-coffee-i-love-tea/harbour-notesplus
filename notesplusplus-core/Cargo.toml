[package]
name = "notesplusplus-core"
version.workspace = true
edition = "2021"
build = "build.rs"

[features]
default = ["whisper"]
# Real offline Whisper STT inference backend (vendored whisper.cpp compiled via `cc`).
# Disable only for host-only builds that don't need speech-to-text.
whisper = []

[build-dependencies]
cc = "1"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
regex = "1"
thiserror = "1"
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.9", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
pem = "3"
ring = "0.17"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
svgbob = "0.6"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3.10"
