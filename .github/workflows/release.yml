name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test -p notesplus-core

  build-rpm:
    name: Build RPM (aarch64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build RPM package
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: '5.1.0.11'
          output-dir: ./rpms

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: harbour-notesplus-aarch64-rpm
          path: ./rpms/*.rpm
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built RPM
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: ./dist
        run: |
          ls -la
          sha256sum *.rpm > sha256sums.txt
          cat sha256sums.txt

      - name: Upload RPM to release
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Notes Plus $TAG" \
            --generate-notes \
            *.rpm \
            sha256sums.txt

  openrepos-publish:
    name: Publish to OpenRepos.net
    needs: [build-rpm, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download built RPM
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install OpenRepos WebClient
        run: |
          python -m pip install --upgrade pip
          pip install openrepos-webclient

      - name: Upload RPMs to OpenRepos.net
        env:
          OPENREPOS_USERNAME: ${{ secrets.OPENREPOS_USERNAME }}
          OPENREPOS_PASSWORD: ${{ secrets.OPENREPOS_PASSWORD }}
        run: |
          if [ -z "$OPENREPOS_USERNAME" ] || [ -z "$OPENREPOS_PASSWORD" ]; then
            echo "::warning ::OPENREPOS_USERNAME or OPENREPOS_PASSWORD secret is not configured. Skipping OpenRepos upload."
            exit 0
          fi

          openrepos \
            --username "$OPENREPOS_USERNAME" \
            --password "$OPENREPOS_PASSWORD" \
            --xvfb \
            --webdriver chrome \
            upload-rpm \
              --appname harbour-notesplus \
              --platform SailfishOS \
              --category Applications \
              ./dist/*.rpm
