[package]
name = "harbour-notesplusplus"
version = "0.1.0"
edition = "2021"
description = "Notes++ — AsciiDoc notes app for Sailfish OS"

[dependencies]
notesplusplus-core = { path = "../notesplusplus-core" }
rusqlite = { version = "0.31", features = ["bundled-full"] }
qmetaobject = "0.2"
chrono = "0.4"
log = "0.4"
sailors = { path = "../vendor/sailors" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.10"
