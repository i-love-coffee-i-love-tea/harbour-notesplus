[package]
name = "harbour-notesplus"
version.workspace = true
edition = "2021"
description = "Notes Plus — AsciiDoc notes app for Sailfish OS"

[dependencies]
notesplusplus-core = { path = "../notesplusplus-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
qmetaobject = "0.2"
log = "0.4"
libc = "0.2"
sailors = { path = "../vendor/sailors" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.10"
