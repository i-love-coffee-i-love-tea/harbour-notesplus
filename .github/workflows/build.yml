name: Build RPM

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SPEC_VERSION=$(grep '^Version:' rpm/harbour-notesplus.spec | awk '{print $2}')
          APPDATA_VERSION=$(grep -oP '<release\s+version="\K[^"]+' rpm/harbour-notesplus.appdata.xml | head -1)
          echo "Cargo workspace version: $CARGO_VERSION"
          echo "Spec version: $SPEC_VERSION"
          echo "AppData version: $APPDATA_VERSION"
          if [ "$CARGO_VERSION" != "$SPEC_VERSION" ] || [ "$CARGO_VERSION" != "$APPDATA_VERSION" ]; then
            echo "ERROR: Version mismatch! Cargo=$CARGO_VERSION, Spec=$SPEC_VERSION, AppData=$APPDATA_VERSION"
            exit 1
          fi

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test -p notesplus-core

  build-rpm:
    name: Build RPM (aarch64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RPM package
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: '5.1.0.11'
          output-dir: ./rpms

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-notesplus-aarch64-rpm
          path: ./rpms/*.rpm
          if-no-files-found: error
