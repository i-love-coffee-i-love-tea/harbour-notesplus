name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test -p notesplusplus-core

  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]
        include:
          - arch: aarch64
            release: '4.5.0.18'
          - arch: armv7hl
            release: '4.5.0.18'
          - arch: i486
            release: '4.5.0.18'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RPM package
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ matrix.release }}
          output-dir: ./RPMS

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-notesplus-${{ matrix.arch }}-rpm
          path: ./RPMS/*.rpm
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built RPMs
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: ./dist
        run: |
          sha256sum *.rpm > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*.rpm
            ./dist/sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  openrepos-publish:
    name: Publish to OpenRepos.net
    needs: [build-rpm, github-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all built RPMs
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenRepos WebClient
        run: |
          python -m pip install --upgrade pip
          pip install openrepos-webclient selenium || true

      - name: Upload RPMs to OpenRepos.net
        env:
          OPENREPOS_USERNAME: ${{ secrets.OPENREPOS_USERNAME }}
          OPENREPOS_PASSWORD: ${{ secrets.OPENREPOS_PASSWORD }}
        run: |
          if [ -z "$OPENREPOS_USERNAME" ] || [ -z "$OPENREPOS_PASSWORD" ]; then
            echo "::warning ::OPENREPOS_USERNAME or OPENREPOS_PASSWORD secret is not configured in GitHub repository secrets. Skipping OpenRepos automatic upload."
            echo "To enable automated OpenRepos publishing, configure OPENREPOS_USERNAME and OPENREPOS_PASSWORD in Repository Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Publishing RPMs to OpenRepos for application harbour-notesplus..."
          python -m openrepos upload ./dist/*.rpm --username "$OPENREPOS_USERNAME" --password "$OPENREPOS_PASSWORD" || {
            echo "::error ::Failed to publish RPMs via openrepos CLI."
            exit 1
          }
